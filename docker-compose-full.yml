services:
  db:
    image: postgres:15-alpine
    container_name: task-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  api:
    command: gunicorn -w 2 --threads 4 --worker-class gthread --timeout 60 --keep-alive 5 -b 0.0.0.0:5000 app:app
    build: ./backend
    container_name: task-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/taskdb
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
      PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - task-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    container_name: task-frontend
    ports:
      - "3000:80"
    networks:
      - task-network
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  task-network:
    driver: bridge