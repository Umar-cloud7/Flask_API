services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: task-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - task-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Flask Backend API
  api:
    build: .
    container_name: task-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/taskdb
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-prod}
      FLASK_ENV: development
    ports:
      - "5000:5000"
    volumes:
      - ./app.py:/app/app.py
    networks:
      - task-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # React Frontend
  frontend:
    build: ./frontend
    container_name: task-frontend
    environment:
      REACT_APP_API_URL: http://api:5000
    ports:
      - "3000:3000"
    networks:
      - task-network
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  task-network:
    driver: bridge
